appId: dev.nievesjesus.distill
productName: distill
directories:
  output: release/lite
files:
  - dist/**
  - package.json
  - node_modules/**
  - "!node_modules/@atjsh/**"
  - "!node_modules/@huggingface/**"
  - "!node_modules/js-tiktoken/**"
  - "!node_modules/onnxruntime-*/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@img/**"
asarUnpack:
  - node_modules/@llamaindex/**
extraResources:
  - from: .cache/tessdata
    to: tessdata
mac:
  target:
    target: dmg
    arch: [arm64, x64]
  identity: null
win:
  target:
    target: nsis
    arch: [x64]
linux:
  target:
    target: AppImage
    arch: [x64]
artifactName: Distill-lite-${version}-${os}-${arch}.${ext}
publish: null
