name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm 12 (supports npm stage)
        run: |
          npm install -g npm@12
          npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify package version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "package.json version v$version does not match release tag $TAG"
            exit 1
          fi
      - name: Stage the release on npm (trusted publishing, OIDC)
        run: npm stage publish --access public
      - name: Summarize staged release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "### distill-llm ${TAG} staged on npm"
            echo ""
            echo "The version is staged, not public yet. A maintainer must approve it with 2FA on https://www.npmjs.com/package/distill-llm (Staged Packages)."
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/nievesjesus/distill
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: setup-qemu-action v4.4.0
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: login-action v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: metadata-action v6.2.0
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest
      - name: build-push-action v7.4.0
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
