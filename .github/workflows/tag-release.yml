name: Tag release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Decide whether to tag
        id: decide
        run: |
          version=$(node -p "require('./package.json').version")
          git tag -l 'v*' | xargs node scripts/release-tag.mjs "$version"
      - name: Tag and start the release build
        if: steps.decide.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "distill $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
      - name: Summarize
        env:
          CREATE: ${{ steps.decide.outputs.create }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          if [ "$CREATE" = "true" ]; then
            echo "Tagged $TAG and started the release build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No tag created for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
