name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac dmg
            resources: mac-arm64/distill.app/Contents/Resources
            platform: mac
            arch: arm64
            full: true
          - os: macos-15-intel
            target: mac dmg
            resources: mac/distill.app/Contents/Resources
            platform: mac
            arch: x64
            full: false
          - os: windows-latest
            target: win nsis
            resources: win-unpacked/resources
            platform: win
            arch: x64
            full: true
          - os: ubuntu-latest
            target: linux AppImage
            resources: linux-unpacked/resources
            platform: linux
            arch: x64
            full: true
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run build:desktop
      - name: Configure macOS signing and notarization
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ] || [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "macOS signing secrets are not all set: building ad-hoc signed installers"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "MAC_SIGNED=true"
            echo "CSC_LINK=$MAC_CERT_P12_BASE64"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Build lite installer
        if: env.MAC_SIGNED != 'true'
        run: npm run dist:lite -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Build full installer
        if: matrix.full && env.MAC_SIGNED != 'true'
        run: npm run dist:full -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Build signed and notarized lite installer
        if: env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          npm run fetch:tessdata
          node scripts/make-signed-config.mjs lite
          npx electron-builder --config electron-builder.lite.signed.yml --${{ matrix.target }} --${{ matrix.arch }}
      - name: Build signed and notarized full installer
        if: matrix.full && env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          npm run fetch:tessdata
          npm run prepare:lingua
          node scripts/make-signed-config.mjs full
          npx electron-builder --config electron-builder.full.signed.yml --${{ matrix.target }} --${{ matrix.arch }}
      - name: Fail on artifacts for another arch
        shell: bash
        run: |
          arch="${{ matrix.arch }}"
          alias="$arch"
          if [ "$arch" = "x64" ]; then alias="x86_64"; fi
          bad=0
          found=0
          while IFS= read -r f; do
            found=1
            case "$f" in
              *-"$arch".*|*-"$alias".*) ;;
              *) echo "unexpected artifact: $f"; bad=1 ;;
            esac
          done < <(find release \( -name 'Distill-*.dmg' -o -name 'Distill-*.exe' -o -name 'Distill-*.AppImage' \))
          if [ "$found" -eq 0 ]; then echo "no installers produced"; bad=1; fi
          exit $bad
      - name: Verify lite variant
        shell: bash
        run: node scripts/check-variant.mjs "release/lite/${{ matrix.resources }}" lite
      - name: Verify full variant
        if: matrix.full
        shell: bash
        run: node scripts/check-variant.mjs "release/full/${{ matrix.resources }}" full
      - name: Verify macOS signature and notarization
        if: env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          variants=lite
          if [ "${{ matrix.full }}" = "true" ]; then variants="lite full"; fi
          for variant in $variants; do
            app="release/$variant/$(dirname "$(dirname "${{ matrix.resources }}")")"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime'
            spctl -a -t exec -vv "$app"
            xcrun stapler validate "$app"
            find "$app" -type f \( -name '*.node' -o -name '*.dylib' \) -print0 | while IFS= read -r -d '' binary; do
              codesign --verify --strict "$binary"
            done
          done
      - name: Stage unsigned Windows installers
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          mkdir unsigned
          cp release/lite/Distill-*.exe release/full/Distill-*.exe unsigned/
      - name: upload-artifact v4.6.2 (unsigned Windows installers)
        id: unsigned
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-win-${{ matrix.arch }}
          path: unsigned/*.exe
          retention-days: 1
          if-no-files-found: error
      - name: submit-signing-request v3
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'distill' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'installers' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Replace Windows installers with the signed ones
        if: matrix.platform == 'win' && env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          signed=(signed/Distill-*.exe)
          signed_count=${#signed[@]}
          if [ "$signed_count" -ne 2 ]; then echo "expected 2 signed installers, found $signed_count"; exit 1; fi
          rm release/lite/Distill-*.exe release/full/Distill-*.exe
          mkdir release/signed
          cp signed/Distill-*.exe release/signed/
      - name: upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/Distill-*.dmg
            release/**/Distill-*.exe
            release/**/Distill-*.AppImage
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Refuse to modify a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if output=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.html_url' 2>&1); then
            echo "release for $TAG is already published: $output"
            exit 1
          fi
          case "$output" in
            *"Not Found"*) echo "no published release for $TAG" ;;
            *) echo "could not check releases for $TAG: $output"; exit 1 ;;
          esac
      - name: action-gh-release v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: installers/**/Distill-*
