name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            resources: mac-arm64/distill.app/Contents/Resources
            platform: mac
            arch: arm64
          - os: macos-13
            resources: mac/distill.app/Contents/Resources
            platform: mac
            arch: x64
          - os: windows-latest
            resources: win-unpacked/resources
            platform: win
            arch: x64
          - os: ubuntu-latest
            resources: linux-unpacked/resources
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run build:desktop
      - run: npm run dist:lite -- --${{ matrix.platform }} --${{ matrix.arch }}
      - run: npm run dist:full -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify lite variant
        shell: bash
        run: node scripts/check-variant.mjs "release/lite/${{ matrix.resources }}" lite
      - name: Verify full variant
        shell: bash
        run: node scripts/check-variant.mjs "release/full/${{ matrix.resources }}" full
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/Distill-*.dmg
            release/**/Distill-*.exe
            release/**/Distill-*.AppImage
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**/Distill-*
