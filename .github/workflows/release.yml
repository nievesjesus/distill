name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac dmg
            resources: mac-arm64/distill.app/Contents/Resources
            platform: mac
            arch: arm64
          - os: macos-15-intel
            target: mac dmg
            resources: mac/distill.app/Contents/Resources
            platform: mac
            arch: x64
          - os: windows-latest
            target: win nsis
            resources: win-unpacked/resources
            platform: win
            arch: x64
          - os: ubuntu-latest
            target: linux AppImage
            resources: linux-unpacked/resources
            platform: linux
            arch: x64
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run build:desktop
      - run: npm run dist:lite -- --${{ matrix.target }} --${{ matrix.arch }}
      - run: npm run dist:full -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Fail on artifacts for another arch
        shell: bash
        run: |
          shopt -s globstar nullglob
          bad=0
          found=0
          for f in release/**/Distill-*.dmg release/**/Distill-*.exe release/**/Distill-*.AppImage; do
            found=1
            case "$f" in
              *-${{ matrix.arch }}.*) ;;
              *) echo "unexpected artifact: $f"; bad=1 ;;
            esac
          done
          if [ "$found" -eq 0 ]; then echo "no installers produced"; bad=1; fi
          exit $bad
      - name: Verify lite variant
        shell: bash
        run: node scripts/check-variant.mjs "release/lite/${{ matrix.resources }}" lite
      - name: Verify full variant
        shell: bash
        run: node scripts/check-variant.mjs "release/full/${{ matrix.resources }}" full
      - name: upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/Distill-*.dmg
            release/**/Distill-*.exe
            release/**/Distill-*.AppImage
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Refuse to modify a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if output=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.html_url' 2>&1); then
            echo "release for $TAG is already published: $output"
            exit 1
          fi
          case "$output" in
            *"Not Found"*) echo "no published release for $TAG" ;;
            *) echo "could not check releases for $TAG: $output"; exit 1 ;;
          esac
      - name: action-gh-release v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: installers/**/Distill-*
