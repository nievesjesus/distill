name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows:
    runs-on: windows-latest
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup-node v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t distill:ci .
      - run: docker run -d --rm -p 4321:4321 --name distill-ci distill:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 10 localhost:4321/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"libreoffice":true' health.json
          grep -q '"installable":true' health.json
          grep -q '"installed":false' health.json
      - name: Parse a sample PDF
        run: |
          npx tsx scripts/make-sample-pdf.ts "$RUNNER_TEMP/sample.pdf"
          curl --fail-with-body --max-time 10 -F "file=@$RUNNER_TEMP/sample.pdf;type=application/pdf" localhost:4321/api/parse > parse.json || { cat parse.json; exit 1; }
          cat parse.json
          node -e "const r=JSON.parse(require('fs').readFileSync('parse.json','utf8')); if(!r.markdown||!r.markdown.trim()) process.exit(1)"
      - name: Stop container
        if: always()
        run: docker stop distill-ci || true
