appId: dev.nievesjesus.distill
productName: distill
directories:
  output: release/full
files:
  - dist/**
  - package.json
  - node_modules/**
asarUnpack:
  - node_modules/@llamaindex/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  - from: .cache/tessdata
    to: tessdata
mac:
  icon: build/icon.png
  target:
    target: dmg
    arch: [arm64, x64]
  identity: "-"
  hardenedRuntime: false
win:
  icon: build/icon.png
  target:
    target: nsis
    arch: [x64]
linux:
  icon: build/icon.png
  target:
    target: AppImage
    arch: [x64]
artifactName: Distill-full-${version}-${os}-${arch}.${ext}
publish: null
